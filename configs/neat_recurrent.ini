[NEAT]
fitness_criterion     = max
fitness_threshold     = 100.0
pop_size              = 60
reset_on_extinction   = False

[DefaultGenome]
num_inputs            = 15
num_hidden            = 4
num_outputs           = 7
feed_forward          = False
initial_connection    = partial_direct 0.6

activation_default    = tanh
bias_init_mean        = 0.0
bias_init_stdev       = 0.6
bias_max_value        = 5.0
bias_min_value        = -5.0
bias_mutate_power     = 0.50
bias_mutate_rate      = 0.7
bias_replace_rate     = 0.10

weight_init_mean      = 0.0
weight_init_stdev     = 1.0
weight_max_value      = 5.0
weight_min_value      = -5.0
weight_mutate_power   = 0.60
weight_mutate_rate    = 0.85
weight_replace_rate   = 0.12

conn_add_prob         = 0.40
conn_delete_prob      = 0.10
node_add_prob         = 0.18
node_delete_prob      = 0.05

compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.5

[DefaultSpeciesSet]
compatibility_threshold = 1.6

[DefaultStagnation]
species_fitness_func  = max
max_stagnation        = 15
species_elitism       = 2

[DefaultReproduction]
elitism               = 2
survival_threshold    = 0.25
