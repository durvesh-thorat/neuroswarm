[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-swarm-maze"
version = "1.0.0"
description = "Pure Neuroevolution Multi-Agent Systems in Fog-of-War Procedural Mazes (Zero LLMs)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "neat-python>=2.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "PyYAML>=6.0",
    "imageio>=2.31.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.32.0",
    "duckdb>=0.10.0",
    "plotly>=5.18.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
